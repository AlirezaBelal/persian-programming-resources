name: Rename README cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rename-readme-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update repository-owned links and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'https://github.com/AlirezaBelal/free-resources/actions/workflows/content-integrity.yml'
          new = 'https://github.com/AlirezaBelal/persian-programming-resources/actions/workflows/content-integrity.yml'
          if old not in text:
              raise SystemExit('expected old repository-owned CI URL not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/rename-readme-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: align CI badge with renamed repository'
          git push
